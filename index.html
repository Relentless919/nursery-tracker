<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#faf8ff;padding-bottom:80px}
.hero{background:linear-gradient(135deg,#fdf2f8,#ede9fe,#dbeafe);padding:18px 16px 14px;position:relative;overflow:hidden}
.hero::after{content:'🍼';position:absolute;top:-8px;right:10px;font-size:60px;opacity:.12;transform:rotate(15deg);pointer-events:none}
.hero-sub{font-size:10px;font-weight:700;letter-spacing:.1em;color:#9333ea;text-transform:uppercase}
.hero h1{font-size:19px;font-weight:700;color:#1e1b4b;margin:1px 0}
.hero p{font-size:11px;color:#7c3aed;margin-bottom:10px}
.pbar{height:6px;background:rgba(255,255,255,.55);border-radius:999px;overflow:hidden}
.pfill{height:100%;background:linear-gradient(90deg,#a78bfa,#60a5fa);border-radius:999px;transition:width .4s}
.plabel{font-size:10px;color:#7c3aed;margin-top:3px}
.budgets{display:flex;gap:7px;padding:10px 14px;overflow-x:auto;scrollbar-width:none}
.budgets::-webkit-scrollbar{display:none}
.bc{flex-shrink:0;background:#fff;border-radius:11px;padding:8px 12px;min-width:80px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.bc .be{font-size:14px;margin-bottom:1px}
.bc .bv{font-size:15px;font-weight:700;color:#1e293b}
.bc .bl{font-size:9px;color:#94a3b8;margin-top:1px}
.sharebar{margin:0 14px 10px;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:11px;padding:9px 12px;display:flex;align-items:center;gap:8px}
.sharebar p{flex:1;font-size:11px;color:#166534;font-weight:500}
.sharebtn{background:#16a34a;color:#fff;border:none;border-radius:20px;padding:6px 12px;font-size:11px;font-weight:700;cursor:pointer}
.sharemsg{font-size:10px;color:#166534;margin:0 14px 6px;display:none}
.tabs{display:flex;gap:6px;padding:0 14px 10px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex-shrink:0;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;background:#fff;color:#64748b;border:1.5px solid #e2e8f0;white-space:nowrap}
.tab.active{color:#fff;border-color:transparent}
.tab-add{flex-shrink:0;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;background:#faf5ff;color:#7c3aed;border:1.5px dashed #c4b5fd;white-space:nowrap}
.sec-hdr{display:flex;align-items:center;justify-content:space-between;padding:2px 14px 8px}
.sec-title{font-size:14px;font-weight:700;color:#1e293b}
.sec-count{font-size:11px;color:#94a3b8}

/* GRID — 3 columns, small squares */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 14px}
.card{border-radius:12px;overflow:hidden;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.08);position:relative;aspect-ratio:1;cursor:pointer;transition:transform .12s}
.card:active{transform:scale(.96)}
.card-img{width:100%;height:100%;object-fit:cover;display:block}
.card-emoji{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:36px;background:linear-gradient(135deg,#f8fafc,#f1f5f9)}
.card-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.7) 0%,rgba(0,0,0,.05) 55%,transparent 100%)}
.card.bought .card-overlay{background:linear-gradient(to top,rgba(22,163,74,.75) 0%,rgba(22,163,74,.15) 55%,transparent 100%)}
.card-bottom{position:absolute;bottom:0;left:0;right:0;padding:5px 6px}
.card-name{font-size:9px;font-weight:600;color:#fff;line-height:1.25;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.card-price{font-size:8px;color:rgba(255,255,255,.85);margin-top:1px}
.card-check{position:absolute;top:5px;right:5px;width:20px;height:20px;border-radius:50%;background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;cursor:pointer}
.card-check.done{background:#16a34a;border-color:#16a34a}
.card-link{position:absolute;top:5px;left:5px;width:20px;height:20px;border-radius:50%;background:rgba(99,102,241,.75);display:flex;align-items:center;justify-content:center;font-size:10px;color:#fff;text-decoration:none}
.card-add{border-radius:12px;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.05);aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;border:2px dashed #e2e8f0}
.card-add:active{transform:scale(.96)}
.card-add-icon{font-size:22px;opacity:.3}
.card-add-lbl{font-size:9px;color:#94a3b8;font-weight:600;text-align:center}

/* Bottom sheet modal */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:flex-end;justify-content:center}

.flabel{font-size:11px;font-weight:600;color:#64748b;margin-bottom:3px;display:block}

.finput:focus{outline:none;border-color:#a78bfa;background:#fff}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.paste-row{display:flex;gap:8px;margin-bottom:10px}
.paste-input{flex:1;font-size:13px;padding:11px 12px;border:1.5px solid #e2e8f0;border-radius:11px;font-family:inherit;background:#fafafa}
.paste-input:focus{outline:none;border-color:#a78bfa;background:#fff}
.btn-fetch{background:#7c3aed;color:#fff;border:none;border-radius:11px;padding:11px 14px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn-fetch:disabled{background:#c4b5fd;cursor:not-allowed}
.fetch-status{font-size:12px;color:#7c3aed;margin-bottom:8px;min-height:16px}
.preview-row{display:flex;gap:10px;align-items:center;background:#f8f7ff;border-radius:11px;padding:10px;margin-bottom:10px}
.preview-thumb{width:56px;height:56px;border-radius:9px;object-fit:cover;background:#e2e8f0;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden}
.preview-info{flex:1;min-width:0}
.preview-name{font-size:13px;font-weight:600;color:#1e293b;margin-bottom:2px}
.preview-price{font-size:12px;color:#7c3aed}
.mactions{display:flex;gap:8px;margin-top:4px}
.btn-buy{flex:1;padding:12px;border-radius:11px;border:none;font-size:14px;font-weight:700;cursor:pointer;background:#16a34a;color:#fff}
.btn-buy.unbuy{background:#f1f5f9;color:#64748b}
.btn-del{padding:12px 14px;border-radius:11px;border:1.5px solid #fca5a5;background:transparent;color:#ef4444;font-size:14px;cursor:pointer}
.btn-save{width:100%;margin-top:8px;padding:13px;border-radius:11px;border:none;font-size:15px;font-weight:700;cursor:pointer;background:#7c3aed;color:#fff}
.add-cat-input{width:100%;font-size:15px;padding:12px 14px;border:1.5px solid #e2e8f0;border-radius:12px;font-family:inherit;margin-bottom:12px}
.add-cat-input:focus{outline:none;border-color:#a78bfa}
.btn-addcat{width:100%;padding:13px;border-radius:12px;border:none;font-size:15px;font-weight:700;cursor:pointer;background:#7c3aed;color:#fff}
.loading{text-align:center;padding:60px 20px;color:#94a3b8;font-size:14px}
</style>
</head>

const ANTHROPIC_KEY = ""; // Leave blank — AI fetch uses a CORS proxy

let state = {cats: DEFAULT_CATS, items: DEFAULT_ITEMS};
let activeCat = "furniture";
let modal = null; // null | {type:'edit',catId,item} | {type:'add',catId} | {type:'addcat'}
let loaded = false;

dbRef.once("value", function(snap){
  var d = snap.val();
  if (d) {
    state.cats = d.cats || DEFAULT_CATS;
    state.items = d.items || DEFAULT_ITEMS;
  } else {
    dbRef.set(state);
  }
  loaded = true;
  render();
});
dbRef.on("value", function(snap){
  var d = snap.val();
  if (d && loaded) {
    state.cats = d.cats || state.cats;
    state.items = d.items || state.items;
    render();
  }
});

function save(){ dbRef.set(state); }
function uid(){ return Math.random().toString(36).slice(2,9); }
function esc(s){ return String(s||"").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fm(n){ return n ? "$"+parseFloat(n).toLocaleString("en-US",{maximumFractionDigits:0}) : "—"; }
function getCat(id){ return state.cats.find(function(c){return c.id===id;}) || {icon:"📦",color:"#64748B",name:id}; }

// AI fetch product info from URL
async function fetchProduct(url) {
  // Use allorigins to bypass CORS, then Claude AI to parse
  var proxyUrl = "https://api.allorigins.win/get?url=" + encodeURIComponent(url);
  var resp = await fetch(proxyUrl);
  var json = await resp.json();
  var html = json.contents || "";

  // Extract og:image, og:title, price via regex
  var title = "";
  var img = "";
  var price = "";

  var titleM = html.match(/<meta[^>]+property=["']og:title["'][^>]+content=["']([^"']+)["']/i)
             || html.match(/<meta[^>]+content=["']([^"']+)["'][^>]+property=["']og:title["']/i);
  if (titleM) title = titleM[1].trim();

  var imgM = html.match(/<meta[^>]+property=["']og:image["'][^>]+content=["']([^"']+)["']/i)
           || html.match(/<meta[^>]+content=["']([^"']+)["'][^>]+property=["']og:image["']/i);
  if (imgM) img = imgM[1].trim();

  var priceM = html.match(/\$\s*([\d,]+(?:\.\d{2})?)/);
  if (priceM) price = priceM[1].replace(/,/g,"");

  // Clean up title (remove site name after | or -)
  if (title) {
    title = title.split(" | ")[0].split(" - ")[0].trim();
    if (title.length > 60) title = title.substring(0,60) + "…";
  }

  return {title: title || "", img: img || "", price: price || ""};
}

function openAdd(catId){ modal = {type:"add", catId:catId, url:"", status:"", preview:null}; render(); }
function openEdit(catId, itemId){
  var item = (state.items[catId]||[]).find(function(i){return i.id===itemId;});
  if (!item) return;
  modal = {type:"edit", catId:catId, item: JSON.parse(JSON.stringify(item))};
  render();
}
function openAddCat(){ modal = {type:"addcat"}; render(); }
function closeModal(){ modal = null; render(); }

function toggleCheck(catId, itemId){
  state.items[catId] = (state.items[catId]||[]).map(function(i){
    return i.id===itemId ? Object.assign({},i,{checked:!i.checked}) : i;
  });
  save(); render();
}
function deleteItem(catId, itemId){
  state.items[catId] = (state.items[catId]||[]).filter(function(i){return i.id!==itemId;});
  save(); modal = null; render();
}
function saveEdit(){
  var e = modal;
  state.items[e.catId] = (state.items[e.catId]||[]).map(function(i){
    return i.id===e.item.id ? e.item : i;
  });
  save(); modal = null; render();
}
function addItemFromPreview(catId, preview, url){
  var item = {
    id: uid(),
    name: preview.title || "New item",
    checked: false,
    notes: "",
    link: url,
    img: preview.img || "",
    est: preview.price || "",
    act: ""
  };
  if (!state.items[catId]) state.items[catId] = [];
  state.items[catId].push(item);
  save(); modal = null; render();
}
function addCategory(name, icon){
  if (!name.trim()) return;
  var id = uid();
  state.cats.push({id:id, name:name.trim(), icon:icon||"📦", color:"#7C3AED"});
  state.items[id] = [];
  activeCat = id;
  save(); modal = null; render();
}

function render(){
  if (!loaded) return;
  var root = document.getElementById("root");
  var all = [];
  state.cats.forEach(function(c){ all = all.concat(state.items[c.id]||[]); });
  var tot = all.length, chk = all.filter(function(i){return i.checked;}).length;
  var pct = tot ? Math.round(chk/tot*100) : 0;
  var est = all.reduce(function(s,i){return s+(parseFloat(i.est)||0);},0);
  var act = all.filter(function(i){return i.act!=="";}).reduce(function(s,i){return s+(parseFloat(i.act)||0);},0);

  var items = state.items[activeCat] || [];
  var cat = getCat(activeCat);
  var catChk = items.filter(function(i){return i.checked;}).length;

  var h = "";

  // Hero
  h += '<div class="hero">';
  h += '<div class="hero-sub">Feldman Family</div>';
  h += '<h1>Nursery Prep</h1>';
  h += '<p>Baby boy &bull; October 2026 &#x1F476;</p>';
  h += '<div class="pbar"><div class="pfill" style="width:'+pct+'%"></div></div>';
  h += '<div class="plabel">'+pct+'% &middot; '+chk+'/'+tot+' items</div>';
  h += '</div>';

  // Budget
  h += '<div class="budgets">';
  h += '<div class="bc"><div class="be">&#x1F4CB;</div><div class="bv">'+fm(est)+'</div><div class="bl">Estimated</div></div>';
  h += '<div class="bc"><div class="be">&#x1F4B3;</div><div class="bv">'+fm(act)+'</div><div class="bl">Spent</div></div>';
  h += '<div class="bc"><div class="be">&#x1F3AF;</div><div class="bv">'+(est?fm(Math.max(0,est-act)):"—")+'</div><div class="bl">Remaining</div></div>';
  h += '<div class="bc"><div class="be">&#x2705;</div><div class="bv">'+chk+'/'+tot+'</div><div class="bl">Bought</div></div>';
  h += '</div>';

  // Share
  h += '<div class="sharebar"><p>&#x1F48C; Share with Anna</p><button class="sharebtn" id="sharebtn">Copy link</button></div>';
  h += '<div class="sharemsg" id="sharemsg">&#x2705; Copied! Send to Anna.</div>';

  // Tabs
  h += '<div class="tabs">';
  state.cats.forEach(function(c){
    var active = c.id===activeCat;
    h += '<div class="tab'+(active?" active":"")+'" data-tab="'+c.id+'" style="'+(active?"background:"+c.color+";border-color:"+c.color:"")+'">'+c.icon+' '+c.name+'</div>';
  });
  h += '<div class="tab-add" id="tab-addcat">+ Category</div>';
  h += '</div>';

  // Section header
  h += '<div class="sec-hdr"><div class="sec-title">'+cat.icon+' '+cat.name+'</div><div class="sec-count">'+catChk+'/'+items.length+' bought</div></div>';

  // Grid
  h += '<div class="grid">';
  items.forEach(function(item){
    h += '<div class="card'+(item.checked?" bought":"")+'" data-edit="'+activeCat+'|'+item.id+'">';
    if (item.img) {
      h += '<img class="card-img" src="'+esc(item.img)+'" onerror="this.style.display=\'none\'" alt=""/>';
      h += '<div class="card-emoji" style="position:absolute;inset:0;display:none">'+cat.icon+'</div>';
    } else {
      h += '<div class="card-emoji">'+cat.icon+'</div>';
    }
    h += '<div class="card-overlay"></div>';
    if (item.link) {
      h += '<a class="card-link" href="'+esc(item.link)+'" target="_blank" data-ext="1">&#x1F517;</a>';
    }
    h += '<div class="card-check'+(item.checked?" done":"")+'" data-chk="'+activeCat+'|'+item.id+'">'+(item.checked?"&#x2713;":"")+'</div>';
    h += '<div class="card-bottom">';
    h += '<div class="card-name">'+esc(item.name)+'</div>';
    if (item.est) h += '<div class="card-price">&dollar;'+(parseFloat(item.est)||0)+'</div>';
    h += '</div></div>';
  });

  // Add card
  h += '<div class="card-add" id="addcard"><div class="card-add-icon">+</div><div class="card-add-lbl">Paste a link</div></div>';
  h += '</div>'; // grid

  // ---- MODALS ----

  // ADD item modal (paste link)
  if (modal && modal.type==="add") {
    var m = modal;
    h += '<div class="mbg" id="mbg">';
    h += '<div class="msheet">';
    h += '<div class="mhandle"></div>';
    h += '<div class="mtitle">Add an item</div>';
    h += '<div class="msub">'+cat.icon+' '+cat.name+' &mdash; paste any product link below</div>';

    h += '<div class="paste-row">';
    h += '<input class="paste-input" id="paste-url" type="url" placeholder="Paste Amazon, Wayfair, Target link..." value="'+esc(m.url||"")+'"/>';
    h += '<button class="btn-fetch" id="btn-fetch"'+(m.fetching?" disabled":"")+'>'+( m.fetching?"&#x23F3;":"Go")+'</button>';
    h += '</div>';
    h += '<div class="fetch-status" id="fetch-status">'+esc(m.status||"")+'</div>';

    if (m.preview) {
      var p = m.preview;
      h += '<div class="preview-row">';
      if (p.img) {
        h += '<div class="preview-thumb"><img src="'+esc(p.img)+'" style="width:100%;height:100%;object-fit:cover" onerror="this.parentNode.innerHTML=\''+cat.icon+'\'"/></div>';
      } else {
        h += '<div class="preview-thumb">'+cat.icon+'</div>';
      }
      h += '<div class="preview-info">';
      h += '<div class="preview-name" id="preview-name-display">'+esc(p.title||"Unknown item")+'</div>';
      h += '<div class="preview-price">'+(p.price?"$"+p.price:"No price found")+'</div>';
      h += '</div></div>';
      h += '<label class="flabel">Edit name (optional)</label>';
      h += '<input class="finput" id="ei-name" type="text" value="'+esc(p.title||"")+'" placeholder="Item name"/>';
      h += '<button class="btn-save" id="btn-addconfirm">Add to '+cat.name+' &#x2192;</button>';
    } else {
      h += '<div style="text-align:center;padding:20px 0;color:#94a3b8;font-size:13px">Or add manually:</div>';
      h += '<label class="flabel">Item name</label>';
      h += '<input class="finput" id="ei-name" type="text" placeholder="Item name"/>';
      h += '<button class="btn-save" id="btn-addmanual">Add item</button>';
    }
    h += '</div></div>';
  }

  // EDIT item modal
  if (modal && modal.type==="edit") {
    var ei = modal.item;
    var ec = modal.catId;
    var ecat = getCat(ec);
    h += '<div class="mbg" id="mbg">';
    h += '<div class="msheet">';
    h += '<div class="mhandle"></div>';
    h += '<div class="mtitle">Edit item</div>';
    h += '<div class="msub">'+ecat.icon+' '+ecat.name+'</div>';

    // Preview thumb
    if (ei.img || ei.link) {
      h += '<div class="preview-row">';
      h += '<div class="preview-thumb">';
      if (ei.img) h += '<img src="'+esc(ei.img)+'" style="width:100%;height:100%;object-fit:cover" onerror="this.parentNode.innerHTML=\''+ecat.icon+'\'"/>';
      else h += ecat.icon;
      h += '</div>';
      h += '<div class="preview-info">';
      h += '<div class="preview-name">'+esc(ei.name)+'</div>';
      if (ei.link) h += '<a href="'+esc(ei.link)+'" target="_blank" style="font-size:11px;color:#7c3aed">Open product link &#x2197;</a>';
      h += '</div></div>';
    }

    h += '<label class="flabel">Name</label>';
    h += '<input class="finput" id="ei-name" type="text" value="'+esc(ei.name)+'" placeholder="Item name"/>';
    h += '<label class="flabel">Product link</label>';
    h += '<input class="finput" id="ei-link" type="url" value="'+esc(ei.link)+'" placeholder="https://..."/>';
    h += '<label class="flabel">Image URL (for photo on card)</label>';
    h += '<input class="finput" id="ei-img" type="url" value="'+esc(ei.img)+'" placeholder="https://...image.jpg"/>';
    h += '<div class="frow">';
    h += '<div><label class="flabel">Estimated ($)</label><input class="finput" id="ei-est" type="number" value="'+esc(ei.est)+'" placeholder="0"/></div>';
    h += '<div><label class="flabel">Actual ($)</label><input class="finput" id="ei-act" type="number" value="'+esc(ei.act)+'" placeholder="0"/></div>';
    h += '</div>';
    h += '<label class="flabel">Notes</label>';
    h += '<input class="finput" id="ei-notes" type="text" value="'+esc(ei.notes)+'" placeholder="Any notes..."/>';
    h += '<div class="mactions">';
    h += '<button class="btn-buy'+(ei.checked?" unbuy":"")+'" id="btn-toggle">'+(ei.checked?"&#x2713; Bought":"Mark as bought")+'</button>';
    h += '<button class="btn-del" id="btn-del">&#x1F5D1;</button>';
    h += '</div>';
    h += '<button class="btn-save" id="btn-save">Save</button>';
    h += '</div></div>';
  }

  // ADD CATEGORY modal
  if (modal && modal.type==="addcat") {
    h += '<div class="mbg" id="mbg">';
    h += '<div class="msheet">';
    h += '<div class="mhandle"></div>';
    h += '<div class="mtitle">Add a category</div>';
    h += '<div class="msub" style="margin-bottom:14px">Give it a name and pick an emoji</div>';
    h += '<label class="flabel">Category name</label>';
    h += '<input class="add-cat-input" id="cat-name" type="text" placeholder="e.g. Toys, Gear, Hospital Bag..."/>';
    h += '<label class="flabel">Emoji icon</label>';
    h += '<input class="add-cat-input" id="cat-icon" type="text" placeholder="e.g. 🧸" maxlength="4"/>';
    h += '<button class="btn-addcat" id="btn-addcat">Add category</button>';
    h += '</div></div>';
  }

  root.innerHTML = h;

  // --- BIND EVENTS ---

  document.getElementById("sharebtn").onclick = function(){
    navigator.clipboard.writeText(window.location.href).catch(function(){});
    var m = document.getElementById("sharemsg");
    m.style.display="block";
    setTimeout(function(){m.style.display="none";},2500);
  };

  document.querySelectorAll(".tab").forEach(function(el){
    el.onclick = function(){ activeCat = el.dataset.tab; render(); };
  });

  var tabAddCat = document.getElementById("tab-addcat");
  if (tabAddCat) tabAddCat.onclick = openAddCat;

  document.querySelectorAll(".card[data-edit]").forEach(function(el){
    el.onclick = function(e){
      if (e.target.closest("[data-ext]") || e.target.closest("[data-chk]")) return;
      var p = el.dataset.edit.split("|");
      openEdit(p[0], p[1]);
    };
  });

  document.querySelectorAll("[data-chk]").forEach(function(el){
    el.onclick = function(e){
      e.stopPropagation();
      var p = el.dataset.chk.split("|");
      toggleCheck(p[0], p[1]);
    };
  });

  var addcard = document.getElementById("addcard");
  if (addcard) addcard.onclick = function(){ openAdd(activeCat); };

  // Modal background close
  var mbg = document.getElementById("mbg");
  if (mbg) mbg.onclick = function(e){ if(e.target.id==="mbg") closeModal(); };

  // ADD modal events
  if (modal && modal.type==="add") {
    var pasteUrl = document.getElementById("paste-url");
    var btnFetch = document.getElementById("btn-fetch");
    var fetchStatus = document.getElementById("fetch-status");

    if (pasteUrl) pasteUrl.focus();

    if (btnFetch) btnFetch.onclick = async function(){
      var url = document.getElementById("paste-url").value.trim();
      if (!url) return;
      modal.url = url;
      modal.fetching = true;
      modal.status = "🔍 Reading product page...";
      modal.preview = null;
      render();
      try {
        var result = await fetchProduct(url);
        modal.fetching = false;
        if (result.title || result.img) {
          modal.preview = result;
          modal.status = "";
        } else {
          modal.status = "Couldn't auto-fill — enter the name below manually.";
        }
      } catch(err) {
        modal.fetching = false;
        modal.status = "Couldn't read that page — enter the name manually below.";
      }
      render();
    };

    if (pasteUrl) pasteUrl.onkeydown = function(e){
      if (e.key==="Enter" && btnFetch) btnFetch.click();
    };

    var btnAddConfirm = document.getElementById("btn-addconfirm");
    if (btnAddConfirm) btnAddConfirm.onclick = function(){
      var name = document.getElementById("ei-name").value.trim() || (modal.preview && modal.preview.title) || "New item";
      var prev = modal.preview || {};
      if (name) prev.title = name;
      addItemFromPreview(modal.catId, prev, modal.url);
    };

    var btnAddManual = document.getElementById("btn-addmanual");
    if (btnAddManual) btnAddManual.onclick = function(){
      var name = document.getElementById("ei-name").value.trim();
      if (!name) return;
      addItemFromPreview(modal.catId, {title:name, img:"", price:""}, modal.url||"");
    };
  }

  // EDIT modal events
  if (modal && modal.type==="edit") {
    var btnSave = document.getElementById("btn-save");
    if (btnSave) btnSave.onclick = function(){
      modal.item.name  = document.getElementById("ei-name").value || modal.item.name;
      modal.item.link  = document.getElementById("ei-link").value;
      modal.item.img   = document.getElementById("ei-img").value;
      modal.item.est   = document.getElementById("ei-est").value;
      modal.item.act   = document.getElementById("ei-act").value;
      modal.item.notes = document.getElementById("ei-notes").value;
      saveEdit();
    };
    var btnToggle = document.getElementById("btn-toggle");
    if (btnToggle) btnToggle.onclick = function(){
      modal.item.checked = !modal.item.checked;
      btnToggle.className = "btn-buy"+(modal.item.checked?" unbuy":"");
      btnToggle.innerHTML = modal.item.checked ? "&#x2713; Bought" : "Mark as bought";
    };
    var btnDel = document.getElementById("btn-del");
    if (btnDel) btnDel.onclick = function(){
      if (confirm("Remove this item?")) deleteItem(modal.catId, modal.item.id);
    };
  }

  // ADD CATEGORY modal events
  if (modal && modal.type==="addcat") {
    var catNameEl = document.getElementById("cat-name");
    if (catNameEl) catNameEl.focus();
    var btnAddCat = document.getElementById("btn-addcat");
    if (btnAddCat) btnAddCat.onclick = function(){
      var name = document.getElementById("cat-name").value;
      var icon = document.getElementById("cat-icon").value || "📦";
      addCategory(name, icon);
    };
    if (catNameEl) catNameEl.onkeydown = function(e){
      if (e.key==="Enter" && btnAddCat) btnAddCat.click();
    };
  }
}
</script>
</body>
</html>
